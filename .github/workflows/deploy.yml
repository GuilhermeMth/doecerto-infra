name: 'Deploy Infra e Apps'

on:
  push:
    branches: [ "main" ]

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    outputs:
      vm_ip: ${{ steps.set-ip.outputs.VM_IP }}
      vm_fqdn: ${{ steps.set-ip.outputs.VM_FQDN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init e Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

      - name: Get VM Outputs
        id: set-ip
        run: |
          cd terraform
          echo "VM_IP=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "VM_FQDN=$(terraform output -raw backend_url_variable)" >> $GITHUB_OUTPUT

  deploy-docker:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Cria o .env com as variáveis da Secret e do Terraform
      - name: Create .env file
        run: |
          cat <<EOF > .env
          ${{ secrets.DOT_ENV }}
          MY_DOMAIN=${{ needs.terraform.outputs.vm_fqdn }}
          VM_IP=${{ needs.terraform.outputs.vm_ip }}
          EOF
          echo "Arquivo .env gerado com sucesso."

      # 2. Espera a VM e o Docker estarem prontos
      - name: Wait for Docker to be ready
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Aguardando cloud-init..."
            cloud-init status --wait
            echo "Verificando Docker..."
            until docker info > /dev/null 2>&1; do 
              sudo systemctl start docker || true
              sleep 5
            done

      # 3. Copia apenas o necessário para a VM
      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker/,.env,Caddyfile"
          target: "/home/${{ secrets.VM_USER }}/app"
          strip_components: 0

      # 4. Executa o Docker Compose forçando o uso do .env
      - name: Executing Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}/app
            
            if [ ! -f .env ]; then echo "ERRO: .env não encontrado!"; exit 1; fi
            
            chmod +x ./docker/entrypoint.sh
            
            echo "Subindo containers..."
            # --env-file .env garante que as variáveis não venham como 'blank'
            docker compose --env-file .env down --remove-orphans
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --force-recreate
            
            echo "Aguardando 20s para status final..."
            sleep 20
            docker ps