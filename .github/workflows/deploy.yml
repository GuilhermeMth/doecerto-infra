name: 'Deploy Infra e Apps'

on:
  push:
    branches: [ "main" ]

jobs:
  terraform:
    # ... (mantenha seu job de terraform como está, ele parece correto)
    name: 'Terraform'
    runs-on: ubuntu-latest
    outputs:
      vm_ip: ${{ steps.set-ip.outputs.VM_IP }}
      vm_fqdn: ${{ steps.set-ip.outputs.VM_FQDN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init e Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"
      - name: Get VM Outputs
        id: set-ip
        run: |
          cd terraform
          echo "VM_IP=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "VM_FQDN=$(terraform output -raw backend_url_variable)" >> $GITHUB_OUTPUT

  deploy-docker:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CORREÇÃO 1: Criar o arquivo explicitamente e verificar existência
      - name: Create .env file
        run: |
          cat <<EOF > .env
          ${{ secrets.DOT_ENV }}
          MY_DOMAIN=${{ needs.terraform.outputs.vm_fqdn }}
          VM_IP=${{ needs.terraform.outputs.vm_ip }}
          EOF
          echo "Conteúdo do .env criado (sem valores sensíveis):"
          ls -la .env

      - name: Wait for Docker to be ready
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cloud-init status --wait
            for i in {1..20}; do
              if docker info > /dev/null 2>&1; then exit 0; fi
              sudo systemctl start docker || true
              sleep 15
            done
            exit 1

      # CORREÇÃO 2: SCP Ajustado
      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Listamos os arquivos explicitamente. O "./" ajuda o SCP a achar na raiz.
          source: "docker-compose.yml,docker/,.env,Caddyfile"
          target: "/home/${{ secrets.VM_USER }}/app"
          # strip_components: 0 garante que a pasta docker/ continue como docker/
          strip_components: 0

      - name: Executing Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}/app
            
            # Verificação de segurança: O arquivo .env chegou?
            if [ ! -f .env ]; then echo "ERRO: Arquivo .env não encontrado!"; exit 1; fi
            
            chmod +x ./docker/entrypoint.sh
            
            # Forçamos a parada e recriação para garantir que o novo .env seja lido
            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d
            
            echo "Aguardando inicialização (30s)..."
            sleep 30
            docker ps