name: 'Deploy Infra e Apps'

on:
  push:
    branches: [ "main" ]

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    outputs:
      vm_ip: ${{ steps.set-ip.outputs.VM_IP }}
      vm_fqdn: ${{ steps.set-ip.outputs.VM_FQDN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init e Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

      - name: Get VM Outputs
        id: set-ip
        run: |
          cd terraform
          echo "VM_IP=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "VM_FQDN=$(terraform output -raw backend_url_variable)" >> $GITHUB_OUTPUT

  deploy-docker:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "${{ secrets.DOT_ENV }}" > .env
          echo "MY_DOMAIN=${{ needs.terraform.outputs.vm_fqdn }}" >> .env
          echo "VM_IP=${{ needs.terraform.outputs.vm_ip }}" >> .env

      - name: Wait for Docker to be ready
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Aguardando cloud-init finalizar..."
            # Espera o cloud-init liberar o sistema
            cloud-init status --wait
            
            echo "Verificando Docker..."
            for i in {1..20}; do
              if docker info > /dev/null 2>&1; then
                echo "Docker está pronto!"
                exit 0
              fi
              echo "Tentativa $i: Docker ainda não responde. Tentando iniciar serviço..."
              sudo systemctl start docker || true
              sleep 15
            done
            exit 1

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./docker-compose.yml,./docker,./.env,./Caddyfile"
          target: "/home/${{ secrets.VM_USER }}/app"

      - name: Executing Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}/app
            
            # 1. Garante permissão de execução no entrypoint copiado
            chmod +x ./docker/entrypoint.sh
            
            # 2. Atualiza as imagens e sobe os containers
            docker compose pull
            docker compose up -d --remove-orphans
            
            # 3. Pequena espera para o MySQL iniciar o processo de boot
            echo "Aguardando inicialização dos containers..."
            sleep 15
            
            # 4. Verificação de status final
            docker ps