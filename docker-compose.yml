name: doecerto

services:
  db:
    image: mysql:8
    container_name: doecerto_db
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: 
      - doecerto_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: doecerto_redis
    restart: always
    networks:
      - doecerto_network
    volumes:
      - redis_data:/data

  api:
    image: guilhermemth/doecerto-api:latest
    container_name: doecerto_api
    restart: always
    user: root  # Essencial para ter permissão de criar a pasta generated
    env_file:
      - .env
      - api.env
    environment:
      - PORT=3501
      - DB_HOST=db
      - REDIS_HOST=redis
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
    # O PULO DO GATO: Gera o prisma ANTES de iniciar o servidor
    command: >
      sh -c "npx prisma generate && node dist/main"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: 
      - doecerto_network
    volumes:
      - uploads_profiles:/app/uploads/profiles
      - uploads_payments:/app/uploads/payment-proofs
      - api_logs:/app/logs
      # Remova ou comente as linhas do entrypoint.sh se elas ainda estiverem lá

  frontend:
    image: guilhermemth/doecerto-front:latest
    container_name: doecerto_frontend
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    environment:
      - PORT=3535 # Força o Next.js/React a subir na porta que o Caddy espera
    networks:
      - doecerto_network
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: doecerto_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - doecerto_network
    depends_on:
      - frontend
      - api

  watchtower:
    image: containrrr/watchtower:latest
    container_name: doecerto_watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup --label-enable
    networks:
      - doecerto_network

networks:
  doecerto_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
  uploads_profiles:
  uploads_payments:
  api_logs: