name: doecerto

services:
  # --- BANCO DE DADOS ---
  db:
    image: mysql:8
    container_name: doecerto_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: 
      - doecerto_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- CACHE ---
  redis:
    image: redis:7-alpine
    container_name: doecerto_redis
    restart: always
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - doecerto_network
    volumes:
      - redis_data:/data

  # --- BACKEND ---
  api:
    image: guilhermemth/doecerto-api:latest
    container_name: doecerto_api
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3501
      - DB_HOST=db
      - REDIS_HOST=redis
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: 
      - doecerto_network
    volumes:
      - uploads_profiles:/app/uploads/profiles
      - uploads_payments:/app/uploads/payment-proofs
      - api_logs:/app/logs
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]

  # --- FRONTEND ---
  frontend:
    image: guilhermemth/doecerto-front:latest
    container_name: doecerto_frontend
    restart: always
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - doecerto_network

  # --- PROXY REVERSO ---
  caddy:
    image: caddy:2-alpine
    container_name: doecerto_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MY_DOMAIN=${MY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - doecerto_network
    depends_on:
      - frontend
      - api

  # --- AUTO UPDATE ---
  watchtower:
    image: containrrr/watchtower:latest
    container_name: doecerto_watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup --label-enable
    networks:
      - doecerto_network

networks:
  doecerto_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
  uploads_profiles:
  uploads_payments:
  api_logs: