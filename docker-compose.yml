services:
  db:
    image: mysql:8
    container_name: doecerto_db
    restart: always
    # Em vez de env_file duplo, passamos a tradução aqui
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: 
      - doecerto_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: guilhermemth/doecerto-api:latest
    container_name: doecerto_api
    restart: always
    env_file:
      - .env
    # Adicionamos environment para garantir que as portas batam
    environment:
      - PORT=3501
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks: 
      - doecerto_network
    volumes:
      - uploads_profiles:/app/uploads/profiles
      - uploads_payments:/app/uploads/payment-proofs
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]

  frontend:
    image: guilhermemth/doecerto-front:latest
    container_name: doecerto_frontend
    restart: always
    env_file:
      - .env
    networks:
      - doecerto_network

  caddy:
    image: caddy:2-alpine
    container_name: doecerto_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MY_DOMAIN=${MY_DOMAIN}
    volumes:
      # Ajustado para a raiz, onde o SCP coloca o arquivo
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - doecerto_network
    depends_on:
      - frontend
      - api