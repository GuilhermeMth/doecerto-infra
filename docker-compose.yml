name: doecerto

services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - doecerto_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    restart: always
    command: redis-server --save 60 1000 --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - doecerto_network
    volumes:
      - redis_data:/data

  api:
    image: guilhermemth/doecerto-api:latest
    restart: always
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - doecerto_network
    ports:
      - "3501:3501"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - uploads_profiles:/app/uploads/profiles
      - uploads_payments:/app/uploads/payment-proofs
      - api_logs:/app/logs

  frontend:
    image: guilhermemth/doecerto-front:latest
    restart: always
    depends_on:
      - api
    networks:
      - doecerto_network
    ports:
      - "3535:3535"
    labels:
      # ADICIONADO: Agora o Watchtower também monitora o front
      - "com.centurylinklabs.watchtower.enable=true"

  caddy:
    image: caddy:latest
    restart: always
    depends_on:
      - frontend
      - api
    networks:
      - doecerto_network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
      # Opcional: Ativa logs mais detalhados para debug
      - WATCHTOWER_DEBUG=true 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: > 
      --interval 30
      --cleanup
      --label-enable
      
networks:
  doecerto_network:

volumes:
  mysql_data:
  redis_data:
  uploads_profiles:
  uploads_payments:
  api_logs:
  caddy_data:
  caddy_config: